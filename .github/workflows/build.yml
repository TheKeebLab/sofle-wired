name: Build firmware
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli@sha256:b7d7fa8fb4432b569931de5ad59098cb788f440ed61a62c5126746b71aee0f4a
    steps:
      - name: Checkout this repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Checkout vial-qmk
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: vial-kb/vial-qmk
          ref: dd43959ae5c08d8a28d38a1acf7b04e86b14a344
          path: qmk_firmware
          submodules: recursive
          persist-credentials: false
      - name: Install the QMK CLI dependencies
        run: pip install -r qmk_firmware/requirements.txt
      - name: Configure the QMK CLI
        run: |
          qmk config userspace_compile.parallel=$(nproc)
          qmk config user.qmk_home=$GITHUB_WORKSPACE/qmk_firmware
          qmk config user.overlay_dir=$GITHUB_WORKSPACE
      - name: Check the userspace
        run: qmk userspace-doctor
      - name: Build
        run: qmk userspace-compile
      - name: Upload the firmware
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Firmware
          path: '*.uf2'
          if-no-files-found: error
